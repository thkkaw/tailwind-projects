<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dist/output.css" />
    <title>Document</title>
</head>

<body>
    <div class="container mx-auto my-10 w-96 shadow-md rounded-lg">
        <div class="group relative w-full h-32">
            <img class="rounded-t-lg w-full h-full object-cover transition delay-150 duration-300 group-hover:scale-105"
            src="https://gotoptoy.com/cdn/shop/articles/ChatGPT_Image_2026_6_8_14_42_23_cafba87e-a107-44b3-b58d-dec1f904e9d3.png?v=1781053882">
            <div
                class="absolute top-2 right-2 px-2 py-1 rounded-full bg-linear-to-r from-orange-400 to-red-500 font-bold text-[10px] text-white">
                POPULAR
            </div>
            <div class="absolute bottom-2 left-2 px-2 py-1 rounded-full bg-slate-100 text-[10px] text-center">
                <div class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></div>
                <div class="inline w-full">12 students currently viewing</div>
            </div>
        </div>

        <div class="p-5">
            <h1 class="font-bold text-xl mb-2">Tailwindcss Master Class</h1>
            <p class="mb-5 text-[12px] opacity-50">Learn modern UI development with Tailwindcss and build beautiful
                responsive website faster.</p>
            <div class="my-5">
                <div class="flex justify-between pb-2 font-bold">
                    <h6 class="text-[12px]">Course Progress</h6>
                    <h6 class="text-[12px] text-indigo-600">70%</h6>
                </div>
                <div class="p-0 w-full h-2 bg-slate-200 rounded-full">
                    <div class="w-7/10 h-2 bg-linear-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full">
                    </div>
                </div>
            </div>
            <form class="pb-1 text-[12px]" action="">
                <label class="block mb-3">
                    <p class="pb-1 font-bold">Name</p>
                    <input type="text" required placeholder="Enter your name"
                        class="peer border border-gray-300 w-full rounded-md p-2 mb-1 focus:outline-none focus:border-pink-500 focus:valid:border-indigo-500 placeholder:opacity-80" />
                    <span class="text-red-500 hidden peer-focus:block peer-focus:peer-valid:hidden">
                        The name field is required.
                    </span>
                </label>
                <label class="block mb-3">
                    <p class="pb-1 font-bold">Email</p>
                    <input type="email" required placeholder="Enter your email"
                        class="peer border border-pink-500 w-full rounded-md p-2 mb-1 focus:outline-none focus:border-pink-500 focus:valid:border-indigo-500 placeholder:opacity-80" />
                    <span class="text-red-500 peer-focus:block peer-focus:peer-valid:hidden">
                        Please enter a valid email address.
                    </span>
                </label>
                <label class="flex mt-5 mb-3">
                    <input type="checkbox">
                    <span class="px-2 text-slate-600">I agree to receive course updates.</span>
                </label>

                <button
                    class="group p-2 w-full text-white font-bold rounded-lg bg-linear-to-r from-blue-500 via-indigo-500 to-purple-500 transition delay-150 ease-in-out duration-300 hover:scale-105 hover:-translate-y-1 hover:bg-linear-to-r hover:from-indigo-500 hover:via-sky-500 hover:to-emerald-500">
                    Enroll Now
                    <svg 
                        xmlns="http://www.w3.org/2000/svg" 
                        fill="none" 
                        viewBox="0 0 24 24" 
                        stroke-width="2"
                        stroke="currentColor" 
                        class="inline size-4 delay-150 duration-300 transition group-hover:translate-x-5"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>

                </button>
            </form>
        </div>
    </div>

    <!-- button -->
    <div 
        class="p-3.5 absolute bottom-5 right-5 bg-blue-500 w-14 h-14 rounded-full text-white hover:-translate-y-3 transition delay-150 duration-300"
    >
        <svg 
            xmlns="http://www.w3.org/2000/svg" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke-width="2" 
            stroke="currentColor"
            class="size-7"
        >
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
        </svg>
    </div>
</body>

</html>
